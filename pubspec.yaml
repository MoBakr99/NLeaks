name: n_leaks
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/pngs/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/pngs/
    - assets/images/svgs/
    - .env

